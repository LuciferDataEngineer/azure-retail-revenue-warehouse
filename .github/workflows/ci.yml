name: Local validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Deterministic tests without credentials or downloads
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Python syntax validation
        run: python -m compileall -q src azure scripts
      - name: Azure shape adapter tests; no cloud calls
        run: python -W error::ResourceWarning -m unittest discover -s azure -p 'test_*.py' -v
      - name: Installed CLI
        run: |
          retail-warehouse --help
          python scripts/generate_fixture.py --output data/fixtures/synthetic-retail.xlsx
          retail-warehouse split --file data/fixtures/synthetic-retail.xlsx --data-dir data/demo
          retail-warehouse load --data-dir data/demo
          python scripts/run_queries.py --data-dir data/demo
          python azure/producer.py --workbook data/fixtures/synthetic-retail.xlsx --data-dir data/demo --output-dir data/cloud-demo --prepare-only
